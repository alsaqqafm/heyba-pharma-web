<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B192C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon Soft Container -->
    <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#navyGrad)" filter="url(#softShadow)"/>
    <rect x="7" y="7" width="86" height="86" rx="24" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Medical Cross + Capsule Dynamic Hybrid -->
    <!-- Pill rotated -->
    <g transform="translate(50, 50) rotate(-35)">
      <!-- Top Half of Capsule -->
      <path d="M-22,-12 C-22,-24 0,-24 0,-12 L0,12 C0,24 -22,24 -22,12 Z" fill="url(#emeraldGrad)" />
      <!-- Bottom Half of Capsule -->
      <path d="M0,-12 C0,-24 22,-24 22,-12 L22,12 C22,24 0,24 0,12 Z" fill="url(#tealGrad)" />
      <!-- Capsule Center Line -->
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Pulse Heartbeat Curve overlay -->
    <path d="M 22 50 L 36 50 L 42 36 L 50 64 L 58 42 L 64 50 L 78 50" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Shiny Glow Dots -->
    <circle cx="72" cy="28" r="4" fill="#34D399"/>
  </g>

  <!-- English & Arabic Brand Typography -->
  <!-- Primary English Name -->
  <text x="120" y="58" font-family="'Cairo', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#0B192C" letter-spacing="-0.5">
    Heyba <tspan fill="#0D9488">Pharma</tspan>
  </text>
  
  <!-- Arabic Name Subtitle -->
  <text x="120" y="88" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="700" fill="#475569">
    هيبا فارما <tspan font-size="14" font-weight="500" fill="#10B981">• للمنتجات الطبية والصيدلانية</tspan>
  </text>
</svg>
