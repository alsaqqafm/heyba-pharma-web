<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="emeraldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon Group -->
  <g transform="translate(10, 10)">
    <rect x="5" y="5" width="90" height="90" rx="26" fill="#1E293B"/>
    <rect x="7" y="7" width="86" height="86" rx="24" fill="none" stroke="url(#emeraldGradW)" stroke-width="2" stroke-opacity="0.6"/>
    
    <g transform="translate(50, 50) rotate(-35)">
      <path d="M-22,-12 C-22,-24 0,-24 0,-12 L0,12 C0,24 -22,24 -22,12 Z" fill="url(#emeraldGradW)" />
      <path d="M0,-12 C0,-24 22,-24 22,-12 L22,12 C22,24 0,24 0,12 Z" fill="url(#tealGradW)" />
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <path d="M 22 50 L 36 50 L 42 36 L 50 64 L 58 42 L 64 50 L 78 50" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- White Typography -->
  <text x="120" y="58" font-family="'Cairo', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Heyba <tspan fill="#2DD4BF">Pharma</tspan>
  </text>
  
  <text x="120" y="88" font-family="'Cairo', system-ui, sans-serif" font-size="20" font-weight="700" fill="#94A3B8">
    هيبا فارما <tspan font-size="14" font-weight="500" fill="#34D399">• للمنتجات الطبية والصيدلانية</tspan>
  </text>
</svg>
