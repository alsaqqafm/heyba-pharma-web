<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#favNavy)"/>
  <rect x="7" y="7" width="86" height="86" rx="24" fill="none" stroke="url(#favEmerald)" stroke-width="2.5" stroke-opacity="0.5"/>
  
  <!-- Capsule emblem -->
  <g transform="translate(50, 50) rotate(-35)">
    <path d="M-22,-12 C-22,-24 0,-24 0,-12 L0,12 C0,24 -22,24 -22,12 Z" fill="url(#favEmerald)" />
    <path d="M0,-12 C0,-24 22,-24 22,-12 L22,12 C22,24 0,24 0,12 Z" fill="url(#favTeal)" />
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pulse Line -->
  <path d="M 20 50 L 34 50 L 41 35 L 50 65 L 58 41 L 65 50 L 80 50" 
        fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>